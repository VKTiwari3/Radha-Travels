<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Black rounded background -->
  <rect width="64" height="64" rx="12" fill="#111111"/>
  <!-- Letter R: vertical bar -->
  <rect x="10" y="14" width="5" height="36" rx="1" fill="#FF6B00"/>
  <!-- Letter R: top horizontal bar -->
  <rect x="10" y="14" width="14" height="5" rx="1" fill="#FF6B00"/>
  <!-- Letter R: middle horizontal bar -->
  <rect x="10" y="29" width="14" height="5" rx="1" fill="#FF6B00"/>
  <!-- Letter R: right bump top -->
  <rect x="24" y="14" width="5" height="10" rx="1" fill="#FF6B00"/>
  <!-- Letter R: right bump bottom -->
  <rect x="24" y="29" width="5" height="5" rx="1" fill="#FF6B00"/>
  <!-- Letter R: diagonal leg -->
  <rect x="24" y="34" width="5" height="16" rx="1" transform="rotate(20 24 34)" fill="#FF6B00"/>
  <!-- Letter T: horizontal bar -->
  <rect x="35" y="14" width="19" height="5" rx="1" fill="#FF6B00"/>
  <!-- Letter T: vertical bar -->
  <rect x="42" y="14" width="5" height="36" rx="1" fill="#FF6B00"/>
</svg>
